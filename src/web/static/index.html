<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>去中心化百科 — Decentralized Encyclopedia</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Decentralized Encyclopedia</h1>
        <p class="subtitle">5 个领域 Agent 经 A2A 风格 JSON-RPC 协议协作 · 中心调度式编排（非 P2P 网络）</p>
        <div id="agent-status" class="agent-bar"></div>
    </header>
    <main>
        <section class="query-section">
            <textarea id="query-input"
                placeholder="输入跨领域问题，例如：&#10;· 量子计算的最新研究进展有哪些？有哪些开源实现？&#10;· 爱因斯坦在哪所大学任教？&#10;· 北京现在天气怎么样？"></textarea>
            <button id="send-btn" onclick="sendQuery()">发送查询</button>
        </section>
        <section class="process-section">
            <h3>通信过程</h3>
            <div id="process-log" class="log"></div>
        </section>
        <section class="result-section">
            <h3>最终回答</h3>
            <div id="answer" class="answer"></div>
        </section>
    </main>
    <script src="/static/app.js"></script>
</body>
</html>
